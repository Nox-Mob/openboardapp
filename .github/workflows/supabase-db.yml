# Supabase database: rebuild from supabase/migrations and (on approval) deploy.
#
# replay  — every pull request and every push to supabase-migration. Starts a local
#           Supabase stack, rebuilds the database from an empty state, lints it, runs
#           the live database-rule suites against it and checks RLS + GRANTs on every
#           public table. Touches no cloud project.
# deploy  — manual (workflow_dispatch) only, behind the `supabase-prod` environment
#           (the owner adds a required reviewer there). Links the new project and
#           pushes the migrations. Credentials come from that environment's secrets.
#           "Dry run" (on by default) only lists the migrations a push would apply.
#
# Run deploy from Actions → Supabase database → Run workflow, choosing the branch that
# holds supabase/migrations (supabase-migration until the Phase 1 cutover).
# This file is also on main so that GitHub shows the Run workflow button. Branches
# without supabase/migrations (main before cutover) skip replay and refuse deploy.
name: Supabase database

on:
  pull_request:
  push:
    branches: [supabase-migration]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: only list the migrations that would be applied"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: supabase-db-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  # Same CLI version the migrations were replayed with locally.
  SUPABASE_CLI_VERSION: 3.0.0

jobs:
  has-migrations:
    name: Branch has supabase/migrations
    runs-on: ubuntu-latest
    outputs:
      found: ${{ steps.look.outputs.found }}
    steps:
      - uses: actions/checkout@v4
      - id: look
        run: |
          if ls supabase/migrations/*.sql >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No supabase/migrations on this branch (main before the Phase 1 cutover): replay and deploy are skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

  replay:
    name: Replay migrations on an empty database
    needs: has-migrations
    if: github.event_name != 'workflow_dispatch' && needs.has-migrations.outputs.found == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The tracked .env points at the Lovable Cloud backend (and the CLI reads
      # SUPABASE_PROJECT_ID from it). Move it aside so nothing in this job can
      # reach Lovable: the tests below must run against the local stack only.
      - name: Detach the Lovable Cloud .env
        run: mv .env .env.lovable-cloud

      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: supabase start (database, auth, REST, storage only)
        run: supabase start -x studio,imgproxy,realtime,edge-runtime,logflare,vector,supavisor,mailpit,postgres-meta

      - name: supabase db reset (apply every migration to an empty database)
        run: |
          supabase db reset 2>&1 | tee reset.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            echo "### ❌ A migration failed to apply on an empty database" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"; tail -40 reset.log >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $code

      - name: supabase db lint --level error
        run: supabase db lint --level error --fail-on error

      - name: Every public table has RLS and a GRANT
        run: |
          db_url=$(supabase status -o json | jq -r .DB_URL)
          psql "$db_url" -v ON_ERROR_STOP=1 -f scripts/ci/check-rls-after-replay.sql 2>&1 | tee rls.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            echo "### ❌ Public tables missing row level security or GRANTs" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"; grep -v '^CONTEXT' rls.log >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $code

      - name: Static migration checks
        run: node scripts/ci/check-migrations.mjs

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci

      - name: Load test-only accounts (Test Org A/B) into the local database
        run: |
          db_url=$(supabase status -o json | jq -r .DB_URL)
          psql "$db_url" -v ON_ERROR_STOP=1 -f scripts/ci/db-test-fixtures.sql

      - name: Live database rule tests against the rebuilt database
        run: |
          eval "$(supabase status -o json | jq -r '"export VITE_SUPABASE_URL=\(.API_URL) VITE_SUPABASE_PUBLISHABLE_KEY=\(.PUBLISHABLE_KEY)"')"
          case "$VITE_SUPABASE_URL" in
            http://127.0.0.1:*|http://localhost:*) ;;
            *) echo "::error::Refusing to run database tests against $VITE_SUPABASE_URL"; exit 1 ;;
          esac
          npx vitest run --config scripts/ci/vitest.db.config.mjs --reporter=default --reporter=github-actions || {
            echo "### ❌ A database rule failed on the rebuilt database (isolation, permissions, locks, voting or letterhead)." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

      - name: Stack logs on failure
        if: failure()
        run: |
          for c in $(docker ps --format '{{.Names}}' | grep '^supabase_'); do
            echo "::group::$c"; docker logs --tail 80 "$c" 2>&1; echo "::endgroup::"
          done

  deploy:
    name: Push migrations to the Supabase project
    needs: has-migrations
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: supabase-prod
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: The chosen branch has supabase/migrations
        if: needs.has-migrations.outputs.found != 'true'
        run: |
          echo "::error::Branch ${GITHUB_REF_NAME} has no supabase/migrations. Run the workflow again and choose the supabase-migration branch."
          exit 1

      - uses: actions/checkout@v4

      # Keep the tracked Lovable Cloud .env from supplying any project setting.
      - name: Detach the Lovable Cloud .env
        run: mv .env .env.lovable-cloud

      - name: Required secrets are set
        run: |
          missing=""
          for s in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            [ -n "${!s}" ] || missing="$missing $s"
          done
          if [ -n "$missing" ]; then
            echo "::error::Add these secrets to the supabase-prod environment:$missing"
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: supabase link
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      # GitHub runners have no IPv6, and the project's direct database host is
      # IPv6-only. Connect through the IPv4 shared pooler (session mode, port 5432)
      # instead, as the CLI itself suggests ("--remote=<pooler db-url>"). The URL is
      # built from the Management API and masked; it is never printed or stored.
      - name: Resolve the IPv4 connection pooler
        run: |
          cfg=$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/config/database/pooler") || {
            echo "::error::Could not read the project's pooler settings from the Management API. A 403 means SUPABASE_ACCESS_TOKEN lacks a scope: it needs project_admin_read, projects_read, database_pooling_config_read and branching_production_read (see docs/migration/settings-to-reenter.md)."; exit 1; }
          pick='[.[] | select((.db_host // "") | test("pooler\\.supabase\\.com$"))]
                | (map(select(.database_type == "PRIMARY")) + .)[0] // empty'
          host=$(jq -r "$pick | .db_host" <<<"$cfg")
          user=$(jq -r "$pick | .db_user" <<<"$cfg")
          name=$(jq -r "$pick | (.db_name // \"postgres\")" <<<"$cfg")
          if [ -z "$host" ] || [ -z "$user" ]; then
            echo "::error::No IPv4 shared pooler (*.pooler.supabase.com) found for this project. Check Database → Connection pooling in the dashboard."
            exit 1
          fi
          pass=$(jq -rn --arg p "$SUPABASE_DB_PASSWORD" '$p | @uri')
          echo "::add-mask::$pass"
          url="postgresql://${user}:${pass}@${host}:5432/${name}"
          echo "::add-mask::$url"
          echo "POOLER_DB_URL=$url" >> "$GITHUB_ENV"
          echo "Using the shared pooler at $host:5432 (session mode)."

      # CLI 3 targets the local database unless --remote is given; --yes is required
      # for hosted changes in a non-interactive job.
      - name: supabase db push
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "### Dry run on ${GITHUB_REF_NAME}: nothing was changed" >> "$GITHUB_STEP_SUMMARY"
            supabase db push --remote="$POOLER_DB_URL" --dry-run --yes 2>&1 | tee push.log
          else
            echo "### Pushed migrations from ${GITHUB_REF_NAME}" >> "$GITHUB_STEP_SUMMARY"
            supabase db push --remote="$POOLER_DB_URL" --yes 2>&1 | tee push.log
          fi
          code=${PIPESTATUS[0]}
          # Log lines are masked by GitHub; strip the connection URL from the summary too.
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -40 push.log | sed -E 's#postgres(ql)?://[^[:space:]]+#postgresql://<redacted>#g' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $code
