# Supabase CLI configuration for OpenBoardApp.
# Reference: https://supabase.com/docs/guides/local-development/cli/config
#
# Phase 0 of the move off Lovable Cloud: this file describes the local stack used by
# .github/workflows/supabase-db.yml to rebuild the database from supabase/migrations.
# It holds no secrets. Anything secret is read with env(...) and supplied by the
# environment (GitHub secrets in CI), never written here.
#
# project_id is the ref of OpenBoard's own Supabase project (Phase 1). Locally it
# only names the Docker containers; the CLI reaches the cloud project only through
# `supabase link` / `--remote` in the deploy job. Before Phase 0 this held the
# Lovable Cloud ref (mgfijwkqnvmhuzykpfcz); see docs/migration/phase-0-inventory.md.
project_id = "dnsqxiiexkdokgebysrt"

[api]
enabled = true
port = 54321
# Only public (plus the default graphql_public) is exposed, as on the new cloud project.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
# Matches the cloud project's "Automatically expose new tables" = off: every table,
# view, sequence and function needs an explicit GRANT in a migration.
auto_expose_new_tables = false

[db]
port = 54322
shadow_port = 54320
health_timeout = "2m"
major_version = 17

[db.pooler]
enabled = false

[db.migrations]
enabled = true

[db.seed]
# No seed: the demo organization needs real auth accounts and is seeded by hand
# (see AGENTS.md). CI loads its own test fixtures from scripts/ci/db-test-fixtures.sql.
enabled = false
sql_paths = ["./seed.sql"]

[realtime]
# The app polls; it does not use realtime channels.
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

# Private bucket for documents, packets and letterheads. Paths start with the
# organization id. Also created by the storage-buckets migration so the cloud
# project gets it from `supabase db push`.
[storage.buckets.org-files]
public = false

[storage.s3_protocol]
enabled = false

[storage.analytics]
enabled = false

[storage.vector]
enabled = false

[auth]
enabled = true
# Local development only; the production site URL is entered in the dashboard
# (docs/migration/settings-to-reenter.md).
site_url = "http://localhost:8080"
additional_redirect_urls = ["http://localhost:*", "http://localhost:*/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 6
password_requirements = ""

[auth.email]
# Email and password sign-in.
enabled = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[auth.sms]
enabled = false

# The app does not call supabase.auth.mfa, so TOTP stays off.
[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false

# Google sign-in goes through Lovable's broker today (src/integrations/lovable).
# Present but disabled until Phase 1 switches the app to supabase.auth.signInWithOAuth.
[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
redirect_uri = ""
url = ""
skip_nonce_check = false

[edge_runtime]
# No edge functions in this repo.
enabled = false

[analytics]
enabled = false
